name: Update Download Badge

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Calculate total downloads
        run: |
          TOTAL=0
          PAGE=1
          while true; do
            DATA=$(curl -sf "https://api.github.com/repos/SyncweApp/Syncwe/releases?per_page=100&page=$PAGE")
            COUNT=$(echo "$DATA" | python3 -c "import sys,json; releases=json.load(sys.stdin); print(sum(a['download_count'] for r in releases for a in r.get('assets',[])))")
            TOTAL=$((TOTAL + COUNT))
            RELEASE_COUNT=$(echo "$DATA" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
            if [ "$RELEASE_COUNT" -lt 100 ]; then break; fi
            PAGE=$((PAGE + 1))
          done

          echo "Total downloads: $TOTAL"
          
          # Format with commas
          FORMATTED=$(printf "%'d" $TOTAL)
          
          cat > docs/public/downloads-badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "downloads",
            "message": "$FORMATTED",
            "color": "blue"
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/downloads-badge.json
          git diff --staged --quiet || git commit -m "chore: update download badge [skip ci]"
          git push
